# Monthly grouped updates keep routine CI churn small; security updates are enabled separately.
# Actions stay pinned by commit, with version comments updated by Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns: ["*"]

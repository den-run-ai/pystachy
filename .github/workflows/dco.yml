# DCO is no longer required. This skipped job preserves the existing branch-protection
# check name until it is removed in GitHub Settings -> Branches -> main.
# Delete this workflow after removing that required status check.
name: DCO (legacy)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  dco:
    name: DCO certified (fork pull requests)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: "true"

# Rewrites a published release's notes from main. Tags, assets and Docker images stay unchanged.
name: Release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release tag, for example v0.4.0-alpha.5'
        required: true
        type: string
      source:
        description: 'notes: the curated docs/releases/VERSION.md on main; reflow: only unwrap the published text'
        required: true
        type: choice
        default: notes
        options: [notes, reflow]

# Shares the Release workflow's group, so a refresh waits for that version's publication.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh published release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NOTES_SOURCE: ${{ inputs.source }}
    steps:
      - name: Require reviewed notes from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Dispatch from main: published notes must come from reviewed sources" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Rewrite the notes above the generated release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json body,isDraft,isPrerelease,tagName > published.json
          python3 tools/release_notes.py refresh --version "$RELEASE_VERSION" --source "$NOTES_SOURCE" \
            --current published.json --output release-notes.md
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

# Report-only coverage (docs/testing.md#compiler-coverage, #native-runtime-coverage). make coverage: the
# CPython-hosted compiler's own source under coverage.py, while it runs the differential, rejection and
# deviation suite (JIT and AOT, in ten shards), the FFI and runtime-cache suites, its unit tests and
# the IR checks of the programs the corpus does not compile (pystachy.py, runtime.py, bench/, tests/ir/).
# make runtime-coverage: the native runtime's C code under clang's source-based coverage, while the
# native compiler's programs run the corpus (in six shards) and the FFI suite. Each part runs in a job
# of its own, as CI's groups do: under ten minutes of work, within a 15-minute limit (Lint's
# tools/test_workflow_limits.py); a report job for each combines them. A failed test, or a process that
# left no data, fails a run; no percentage does, and nothing waits for it. Daily and on demand, and on
# pushes to main that change its setup or the suites' runners. Manual runs (input base, by default
# origin/main) list changed code that no suite ran (COVERAGE_BASE). PRs use the compact CI profile.
# Each run on main also commits its results to the badges branch, which the README's badges read
# (coverage.json and coverage.md, runtime-coverage.json and runtime-coverage.md), from a job of its
# own, which may write and runs no test.
name: Coverage

on:
  schedule:
    - cron: '41 5 * * *'   # daily, 05:41 UTC
  workflow_dispatch:
    inputs:
      base:
        description: The git ref whose changes the summaries list the coverage of (empty for none)
        default: origin/main
        required: false
  push:
    branches: [main]
    paths:
      - .coveragerc
      - .github/workflows/coverage.yml
      - tests/cache.sh
      - tests/corpus.sh
      - tests/ffi/run.sh
      - tests/run.sh
      - tools/coverage.sh
      - tools/coverage_report.py
      - tools/requirements-dev.txt
      - tools/runtime_coverage.sh
      - tools/shard_cases.sh
      - tools/verification_bootstrap.py
      - tools/merge_verification.py
      - tests/verify.sh
concurrency:
  group: coverage-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: verified compiler producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      PYSTACHY_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal
      - name: Verify compiler and runtime fixed points
        run: tests/verify.sh bootstrap
      - name: Package verified bootstrap
        run: python3 tools/verification_bootstrap.py export build/ci-bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  hosted:
    name: hosted compiler coverage (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Split the complete corpus ten ways to target headroom below the 15-minute limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: corpus 0 of 10, suites: corpus, shard: 0/10}
          - {name: corpus 1 of 10, suites: corpus, shard: 1/10}
          - {name: corpus 2 of 10, suites: corpus, shard: 2/10}
          - {name: corpus 3 of 10, suites: corpus, shard: 3/10}
          - {name: corpus 4 of 10, suites: corpus, shard: 4/10}
          - {name: corpus 5 of 10, suites: corpus, shard: 5/10}
          - {name: corpus 6 of 10, suites: corpus, shard: 6/10}
          - {name: corpus 7 of 10, suites: corpus, shard: 7/10}
          - {name: corpus 8 of 10, suites: corpus, shard: 8/10}
          - {name: corpus 9 of 10, suites: corpus, shard: 9/10}
          - {name: 'ffi, ir', suites: ffi ir, shard: ''}
          - {name: 'cache, unit', suites: cache unit, shard: ''}
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the tests run arbitrary programs: no token for them to read

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal

      - run: python3 -m pip install -r tools/requirements-dev.txt

      - name: tools/coverage.sh (a part of make coverage)
        env:
          PY: python3
          COVERAGE_SUITES: ${{ matrix.suites }}
          COVERAGE_SHARD: ${{ matrix.shard }}
          COVERAGE_REPORT: '0'
        run: tools/coverage.sh

      - name: Upload the part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-part-${{ strategy.job-index }}
          path: build/coverage/parts
          if-no-files-found: error
          retention-days: 14

  hosted-report:
    name: hosted compiler coverage (report)
    needs: hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # (the merge base of the changes the summary lists)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - run: python3 -m pip install -r tools/requirements-dev.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: coverage-part-*
          path: build/coverage/parts
          merge-multiple: true

      - name: tools/coverage_report.py (the parts combined)
        env:
          COVERAGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base || '' }}
        run: python3 tools/coverage_report.py

      - name: Job summary
        if: always()
        run: if [ -f build/coverage/summary.md ]; then cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            build/coverage/html
            build/coverage/coverage.json
            build/coverage/summary.md
            build/coverage/badge.json
            build/coverage/parts/*.json
            build/coverage/parts/*.log
          if-no-files-found: error
          retention-days: 14

  runtime:
    needs: bootstrap
    name: native runtime coverage (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Share the verified default compiler; each row still builds its own instrumented runtime.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: corpus 0 of 6, suites: corpus, shard: 0/6}
          - {name: corpus 1 of 6, suites: corpus, shard: 1/6}
          - {name: corpus 2 of 6, suites: corpus, shard: 2/6}
          - {name: corpus 3 of 6, suites: corpus, shard: 3/6}
          - {name: corpus 4 of 6, suites: corpus, shard: 4/6}
          - {name: corpus 5 of 6, suites: corpus, shard: 5/6}
          - {name: ffi, suites: ffi, shard: ''}
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      PYSTACHY_JOBS: '4'
      PYSTACHY_HOME: ${{ github.workspace }}
      COMPILER: ${{ github.workspace }}/build/verify/pystachy2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 toolchain and clang's profile runtime
        run: tools/setup.sh

      # No run-id or token: only a producer in this workflow run can supply the compiler.
      - name: Download verified bootstrap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap
      - name: Validate and restore the native compiler
        run: python3 tools/verification_bootstrap.py restore build/ci-bootstrap

      - name: tools/runtime_coverage.sh (a part of make runtime-coverage)
        env:
          PY: python3
          RUNTIME_COVERAGE_SUITES: ${{ matrix.suites }}
          RUNTIME_COVERAGE_SHARD: ${{ matrix.shard }}
          RUNTIME_COVERAGE_REPORT: '0'
        run: tools/runtime_coverage.sh

      - name: Upload the part
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtime-coverage-part-${{ strategy.job-index }}
          path: build/runtime-coverage/parts
          if-no-files-found: error
          retention-days: 14

  runtime-report:
    name: native runtime coverage (report)
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # (the merge base of the changes the summary lists)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: runtime-coverage-part-*
          path: build/runtime-coverage/parts
          merge-multiple: true

      - name: tools/runtime_coverage.sh --report (the parts combined)
        env:
          PY: python3
          COVERAGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base || '' }}
        run: tools/runtime_coverage.sh --report

      - name: Job summary
        if: always()
        run: if [ -f build/runtime-coverage/summary.md ]; then cat build/runtime-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runtime-coverage
          path: |
            build/runtime-coverage/html
            build/runtime-coverage/coverage.json
            build/runtime-coverage/lcov.info
            build/runtime-coverage/summary.md
            build/runtime-coverage/badge.json
            build/runtime-coverage/parts/*.json
            build/runtime-coverage/parts/*.log
          if-no-files-found: error
          retention-days: 14

  badge:
    name: publish main's coverage to the badges branch
    needs: [hosted-report, runtime-report]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - if: needs.hosted-report.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: coverage
          path: report

      - if: needs.runtime-report.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: runtime-coverage
          path: runtime

      - name: Commit the reports that passed to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git init -q badges
          cd badges
          # (the first run finds no badges branch: its commit starts the branch)
          if git fetch -q --depth=1 "$remote" badges; then git checkout -q FETCH_HEAD; fi
          if [ -f ../report/badge.json ]; then cp ../report/badge.json coverage.json && cp ../report/summary.md coverage.md; fi
          if [ -f ../runtime/badge.json ]; then cp ../runtime/badge.json runtime-coverage.json && cp ../runtime/summary.md runtime-coverage.md; fi
          git add -A .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Coverage of $GITHUB_SHA"
          git push -q "$remote" HEAD:refs/heads/badges

# Check PR titles and bodies with a read-only token, including same-repository PRs.
# The job's own check is the result; issue labeling has a separate workflow.
name: Submission format

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Keep this distinct from the legacy submission-<number> group during migration.
  group: submission-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    # Keep the required-check name aligned with tools/check_submission.py's CHECK.
    name: Submission format
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate current metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_submission.py

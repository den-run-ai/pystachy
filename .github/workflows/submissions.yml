# Checks issue and PR titles and bodies; builds and tests nothing. Pull requests use
# pull_request, as CI and Lint do: a fork's run gets a read-only token, so this job's own
# check is the PR's result. GitHub blocks pull_request_target by default in public repositories.
name: Submission format

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write  # Issue labels; the PR path only reads.

concurrency:
  group: submission-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    # Branch protection requires this check name (tools/check_submission.py's CHECK).
    name: Submission format
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate current metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_submission.py

# Metadata only: checkout trusted base/default code, never a PR's head.
name: Submission format

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: submission-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    name: Check title and description
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate current metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_submission.py

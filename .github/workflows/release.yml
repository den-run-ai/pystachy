name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - tools/release*.py
      - tools/test_release*.py
      - tools/linux_abi.py
      - tools/test_linux_abi.py
      - tools/docker_smoke.sh
      - VERSION
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, for example v0.1.0-alpha.1'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.pull_request.number || inputs.version || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve immutable source and release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          publish = os.environ['EVENT'] != 'pull_request'
          semver = r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?'
          declared = Path('VERSION').read_text().strip()
          if not re.fullmatch(semver, declared):
              raise SystemExit('VERSION must be a v-prefixed semantic version')
          # A version bump carries its curated notes, which publication uses; pull requests check them too.
          if not Path('docs/releases', declared + '.md').is_file():
              raise SystemExit(f'Add release notes for {declared} as docs/releases/{declared}.md')
          if publish:
              if os.environ['EVENT'] == 'workflow_dispatch' and os.environ['REF'] != 'refs/heads/main':
                  raise SystemExit('Dispatch releases from main only')
              version = os.environ['INPUT_VERSION'] if os.environ['EVENT'] == 'workflow_dispatch' else os.environ['REF_NAME']
              if not re.fullmatch(semver, version):
                  raise SystemExit('Version must be a v-prefixed semantic version')
              if declared != version:
                  raise SystemExit('Release tag must match VERSION; bump VERSION on main before releasing')
              subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'origin/main'], check=True)
          else:
              version = 'v0.0.0-test.' + commit[:8]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ncommit={commit}\npublish={str(publish).lower()}\nprerelease={str("-" in version).lower()}\n')
          PY

      - name: Require green CI on the release commit
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release_gate.py --repository "$GITHUB_REPOSITORY" \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION" --wait-seconds 1200

  binaries:
    needs: prepare
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 llvm-18-runtime

      - name: LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@20

      - name: Bootstrap, package, and test relocation without Python
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          make
          python3 -m unittest discover -s tools -p 'test_release*.py'
          make test-install
          python3 tools/release.py --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --target "$RELEASE_TARGET" --output-dir dist
          python3 tools/release_smoke.py "dist/pystachy-$RELEASE_VERSION-$RELEASE_TARGET.tar.gz"

      - name: Audit the complete Linux archive payload
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          from release_smoke import extract, verify_manifest
          name = 'pystachy-' + os.environ['RELEASE_VERSION'] + '-' + os.environ['RELEASE_TARGET']
          directory = extract(Path('dist', name + '.tar.gz'), Path('build/linux-abi-payload'))
          verify_manifest(directory)
          PY
          python3 tools/linux_abi.py build/linux-abi-payload --architecture "${RELEASE_TARGET#linux-}" \
            --max-glibc 2.39 --json "dist/linux-abi-$RELEASE_TARGET.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  container:
    needs: [prepare, binaries]
    name: Container (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux-aarch64
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: binary-${{ matrix.target }}
          path: dist/binary

      - name: Verify and stage the tested native archive
        run: |
          (cd dist/binary && sha256sum -c ./*.sha256)
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys
          sys.path.insert(0, 'tools')
          from release_smoke import extract, verify_manifest
          version, target, commit = (os.environ[name] for name in ('RELEASE_VERSION', 'RELEASE_TARGET', 'RELEASE_COMMIT'))
          archive = Path('dist/binary') / f'pystachy-{version}-{target}.tar.gz'
          directory = extract(archive, Path('build/container-extract'))
          manifest = verify_manifest(directory)
          if (manifest['version'], manifest['target'], manifest['commit']) != (version, target, commit):
              raise SystemExit('Container archive does not match the selected release')
          prefix = Path('build/container-payload/out/usr/local')
          for name in ('bin', 'libexec'):
              shutil.copytree(directory / name, prefix / name)
          PY

      - name: Build the native image from its verified compiler archive
        run: |
          docker buildx build --platform "linux/$RELEASE_ARCH" --load \
            --build-context build=build/container-payload \
            --build-arg "VERSION=$RELEASE_VERSION" --build-arg "REVISION=$RELEASE_COMMIT" \
            --tag "pystachy:release-test-$RELEASE_ARCH" .
          test "$(docker image inspect "pystachy:release-test-$RELEASE_ARCH" --format '{{.Os}}/{{.Architecture}}')" = "linux/$RELEASE_ARCH"

      - name: Test JIT/AOT and bind mounts as an unprivileged user
        run: |
          docker run --rm --user 10001:10001 --entrypoint pystachy-smoke "pystachy:release-test-$RELEASE_ARCH"
          mkdir -p build/container-smoke
          chmod 777 build/container-smoke
          printf 'print(332833500)\n' > build/container-smoke/demo.py
          docker run --rm --user 10001:10001 -v "$PWD/build/container-smoke:/work" \
            "pystachy:release-test-$RELEASE_ARCH" run demo.py | tee build/container-smoke/jit.out
          test "$(cat build/container-smoke/jit.out)" = 332833500
          docker run --rm --user 10001:10001 -v "$PWD/build/container-smoke:/work" \
            "pystachy:release-test-$RELEASE_ARCH" build demo.py -o demo
          test "$(build/container-smoke/demo)" = 332833500

      - name: Save the tested image for publication
        run: |
          mkdir -p dist/container
          docker save "pystachy:release-test-$RELEASE_ARCH" | gzip -n > "dist/container/pystachy-image-$RELEASE_ARCH.tar.gz"
          cd dist/container
          sha256sum "pystachy-image-$RELEASE_ARCH.tar.gz" > "pystachy-image-$RELEASE_ARCH.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-linux-${{ matrix.arch }}
          path: dist/container/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, binaries, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Recheck version and exact commit immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_gate.py --repository "$GITHUB_REPOSITORY" \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_VERSION"

      - name: Require publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/binaries

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: container-linux-*
          merge-multiple: true
          path: dist/container

      - name: Verify downloads and load both tested native images
        run: |
          cd dist/binaries
          sha256sum -c ./*.sha256
          sha256sum ./*.tar.gz > SHA256SUMS
          cd ../container
          sha256sum -c ./*.sha256
          for arch in amd64 arm64; do
            docker load --input "pystachy-image-$arch.tar.gz"
          done

      - name: Push both tested images and their versioned manifest to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          image=${DOCKERHUB_IMAGE:-$DOCKERHUB_USERNAME/pystachy}
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout >/dev/null 2>&1' EXIT
          python3 tools/release_images.py --image "$image" --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
          printf 'DOCKER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"

      - name: Determine whether to advance latest
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'tools')
          from release_gate import get_json, should_promote
          latest = get_json('repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/latest', os.environ['GH_TOKEN'], missing_ok=True)
          promote = should_promote(os.environ['RELEASE_VERSION'], latest['tag_name'] if latest else None)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PROMOTE_LATEST={str(promote).lower()}\n')
          PY

      - name: Publish GitHub release binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "docs/releases/$RELEASE_VERSION.md" release-notes.md
          # Markdown backticks are literal text, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '\n## Release assets\n\nNative compiler packages for Linux x86-64/AArch64 and macOS arm64/x86-64.\n\n'
            printf 'Docker image: `%s:%s` (linux/amd64 and linux/arm64, LLVM 18 included).\n\n' "$DOCKER_IMAGE" "$RELEASE_VERSION"
            printf 'Binary packages require LLVM 18 on Linux or LLVM 20 on macOS. See [installation instructions](https://github.com/%s/blob/%s/docs/install.md).\n\nSource commit: `%s`.\n' \
              "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$RELEASE_COMMIT"
          } >> release-notes.md
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
              --draft --title "Pystachy $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" dist/binaries/* --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --draft=false --prerelease=false --latest=false
          fi

      - name: Update latest for newer stable releases
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$PROMOTE_LATEST" = true ] || exit 0
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          trap 'docker logout >/dev/null 2>&1' EXIT
          python3 tools/release_promote.py --repository "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" --image "$DOCKER_IMAGE"

# Full verification on every push: bootstrap fixed point, differential tests with the CPython-hosted
# and native compilers, the Python-free native stage, the UBSan stage, an llvm-as check of the IR, the
# garbage-collector stress stage, the benchmarks, the dict probe counts and the compile-time scaling
# check (see tests/verify.sh). build/verification.json is uploaded even when a step fails.
#
# One run per commit: a push to a pull request's branch runs once, and its check shows on the pull
# request (a pull_request trigger ran the same commit a second time). A newer push to the same branch
# cancels the older run; on main every commit runs to the end.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: make verify (Linux x86-64, LLVM 18, Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the tests run arbitrary programs: no token for them to read

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version   # the CPython the tests' expected output was recorded with

      - name: LLVM 18 toolchain
        # the runner image has it; tools/setup.sh runs apt only for a missing package
        run: tools/setup.sh

      - name: make verify
        run: make verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verification
          path: |
            build/verification.json
            build/verify/*.log
          if-no-files-found: warn

# Pull requests use the bounded PR profile; main/manual runs retain full release evidence.
# Tests enforce <=20 jobs across every PR workflow, <=2 workers per task group and <=15 min/job.
# Consumers reuse a same-run verified bootstrap; runtime caches remain private.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYSTACHY_JOBS: '4'
  CI_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

jobs:
  bootstrap:
    name: verify (bootstrap, ${{ matrix.machine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Each matrix row publishes a distinct output so the aggregate can check agreement.
    outputs:
      plan_x86_64: ${{ steps.plan.outputs.plan_x86_64 }}
      plan_aarch64: ${{ steps.plan.outputs.plan_aarch64 }}
      # Both workers verify the same immutable event merge, hence the same base.
      base: ${{ steps.plan.outputs.base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            machine: x86_64
          - os: ubuntu-24.04-arm
            machine: aarch64
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select documentation or code verification
        id: plan
        env:
          CI_MACHINE: ${{ matrix.machine }}
        run: |
          plan=$(python3 tools/ci_gate.py plan "$GITHUB_EVENT_NAME" "$CI_EVENT_BASE_SHA" "$GITHUB_SHA" "$CI_HEAD_SHA")
          base=
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=$(git rev-parse HEAD^1); fi
          printf 'kind=%s\nplan_%s=%s\n' "$plan" "$CI_MACHINE" "$plan" >> "$GITHUB_OUTPUT"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'Verification plan: %s\n' "$plan"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.plan.outputs.kind == 'code'
        with:
          python-version-file: .python-version
      - name: LLVM toolchain
        if: steps.plan.outputs.kind == 'code'
        env:
          ARM_PR: ${{ github.event_name == 'pull_request' && matrix.machine == 'aarch64' }}
        run: |
          if [ "$ARM_PR" = true ]; then tools/setup.sh --verify; else tools/setup.sh --minimal; fi
      - name: Record native Linux ABI
        if: steps.plan.outputs.kind == 'code'
        env:
          VERIFY_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$VERIFY_MACHINE"
          getconf PAGESIZE
          getconf GNU_LIBC_VERSION
      - name: Verify compiler and runtime fixed points
        if: steps.plan.outputs.kind == 'code'
        run: tests/verify.sh bootstrap
      - name: Package verified bootstrap
        if: steps.plan.outputs.kind == 'code'
        run: python3 tools/verification_bootstrap.py export build/ci-bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.plan.outputs.kind == 'code'
        with:
          name: verified-bootstrap-${{ matrix.machine }}
          path: build/ci-bootstrap/
          if-no-files-found: error
          retention-days: 7
          overwrite: true  # allow a producer rerun; consumers still validate this run and commit
      - name: Compare O1 temporary compiler with verified O2 bootstrap
        if: steps.plan.outputs.kind == 'code' && matrix.machine == 'x86_64'
        run: python3 tools/check_bootstrap_tier.py build/ci-bootstrap
      - name: ARM64 installation, FFI, JIT runner and ABI smoke
        if: steps.plan.outputs.kind == 'code' && github.event_name == 'pull_request' && matrix.machine == 'aarch64'
        run: |
          cp build/verify/pystachy2 pystachy
          make test-install
          python3 tools/install_smoke.py
          tests/ffi/run.sh ./pystachy > build/verify/arm-ffi.log 2>&1
          cat build/verify/arm-ffi.log
          if grep -Fq '; skipped:' build/verify/arm-ffi.log; then exit 1; fi
          python3 -m unittest discover -s tools -p test_runtime_thread.py
          python3 -m unittest discover -s tools -p test_stack_floor.py
          python3 -m unittest discover -s tools -p test_runtime_signatures.py
          python3 -m unittest discover -s tools -p test_runtime_ubsan.py
          python3 -m unittest discover -s tools -p test_lljit.py
          python3 tools/program_cache_probe.py --compiler ./pystachy --llvm "$PYSTACHY_LLVM" \
            --checks reuse semantics concurrency --output build/verify/arm-program-cache.json
      - name: Upload bootstrap report
        if: ${{ !cancelled() && steps.plan.outputs.kind == 'code' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.machine }}-verification-bootstrap
          path: |
            build/verification.json
            build/verify/bootstrap.log
            build/verify/arm-ffi.log
            build/verify/arm-program-cache.json
            build/bootstrap-tier/report.json
            build/bootstrap-tier/make.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  verification:
    name: verify (${{ matrix.group }}, ${{ matrix.machine }})
    needs: bootstrap
    if: needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code'
    runs-on: ${{ matrix.machine == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # Target <10 minutes of work per group; retain headroom for runner variation
    # and failure diagnostics. GC self-compilation has its own 10-minute bound.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64","aarch64"]') }}
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["hosted","native-aot-0","native-aot-1","safety-0","safety-1","opt-in","contracts","cache-gc","benchmarks"]' || '["hosted","native-0","native-1","native-2","opt-off-0","opt-off-1","opt-off-2","python-free-0","python-free-1","python-free-2","ubsan-0","ubsan-1","ubsan-2","ubsan-3","gc-self","gc-ir-0","gc-ir-1","gc-jit-0","gc-jit-1","gc-aot-0","gc-aot-1","gc-aot-2","runtime-cache","dynany-optin-0","dynany-optin-1","dynany-optin-2","python-int-optin-0","python-int-optin-1","python-int-optin-2","contracts","benchmarks","scaling"]') }}
    env:
      VERIFY_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      CI_BASE_SHA: ${{ needs.bootstrap.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: LLVM 18 toolchain
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        # Only the sanitizer and BLAS jobs need the extra verification packages.
        # New groups keep the full setup until their dependencies have been checked.
        run: |
          case "$VERIFY_GROUP" in
            hosted|native-[012]|native-aot-[01]|opt-off-[012]|python-free-[012]|gc-self|gc-ir-[01]|gc-jit-[01]|gc-aot-[012]|runtime-cache|dynany-optin-[012]|python-int-optin-[012]|contracts|scaling|safety-0|opt-in|cache-gc)
              tools/setup.sh --minimal ;;
            *) tools/setup.sh --verify ;;
          esac

      - name: Opt-in sweeps and Lean corpus CPython dependencies
        if: startsWith(matrix.group, 'dynany-optin-') || startsWith(matrix.group, 'python-int-optin-') || matrix.group == 'opt-in' || (matrix.group == 'gc-jit-1' && matrix.machine == 'x86_64')
        run: python3 -m pip install "$(sed -n '/^typing_extensions==/p' tools/requirements-dev.txt)" "$(sed -n '/^mypy_extensions==/p' tools/requirements-dev.txt)" "$(sed -n '/^librt==/p' tools/requirements-dev.txt)"

      - name: Workload pytest oracle dependency
        if: matrix.group == 'benchmarks' || matrix.group == 'hosted'
        run: python3 -m pip install "$(sed -n '/^pytest==/p' tools/requirements-dev.txt)"

      # No run-id or token: download-artifact can only select this workflow run here.
      - name: Download verified bootstrap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: verified-bootstrap-${{ matrix.machine }}
          path: build/ci-bootstrap

      - name: Verify group
        env:
          VERIFY_GROUP: ${{ matrix.group }}
          VERIFY_BOOTSTRAP_DIR: build/ci-bootstrap
        run: tests/verify.sh "$VERIFY_GROUP"

      # These hosted/native controls run sequentially after a short GC JIT group.
      # PRs use the second native JIT worker below; neither placement adds a job.
      - name: Runtime ABI and GC root checker controls
        if: matrix.group == 'gc-jit-0' && matrix.machine == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-rt-18-dev
          # Generated-code ASan controls run in the existing x86 contracts job.
          PYSTACHY_CACHE_TEST_LLVM="$PYSTACHY_LLVM" python3 - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.discover("tools", pattern=path.name)
              for path in sorted(Path("tools").glob("test_runtime_*.py"))
              if path.name != "test_runtime_asan.py"
          )
          raise SystemExit(not unittest.TextTestRunner().run(suite).wasSuccessful())
          PY
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh '-fsanitize=address,undefined'
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh --negative-control '-fsanitize=address,undefined'

      # Keep the complete Lean corpora at two workers. Runtime-cache plus corpus proofs and
      # the program-cache probe exceeded 15 minutes; gc-jit-1 has room after its corpus.
      # Storage proofs use full scaling. PR opt-in retains all three checks; contracts checks
      # bounded union/null examples. Each check finishes before the next begins.
      # The pinned release archive is for x86_64 Linux.
      - name: Lean proofs of compiler guard obligations
        if: matrix.machine == 'x86_64' && (matrix.group == 'opt-in' || matrix.group == 'gc-jit-1' || matrix.group == 'scaling' || matrix.group == 'contracts')
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: |
          lean_boundary_dir=$(mktemp -d)
          trap 'rm -rf "$lean_boundary_dir"' EXIT
          curl --fail --location --silent --show-error --retry 2 --retry-max-time 240 \
            --connect-timeout 20 --max-time 120 \
            'https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst' \
            --output "$lean_boundary_dir/lean.tar.zst"
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' \
            "$lean_boundary_dir/lean.tar.zst" | sha256sum --check -
          tar --no-same-owner --zstd -xf "$lean_boundary_dir/lean.tar.zst" -C "$lean_boundary_dir"
          case "$VERIFY_GROUP" in
            opt-in|gc-jit-1)
              PATH="$lean_boundary_dir/lean-4.35.0-linux/bin:$PATH" \
                make check-lean-corpus LEAN_CORPUS_FLAGS='--jobs 2 --report build/verify/lean-corpus.json'
              PATH="$lean_boundary_dir/lean-4.35.0-linux/bin:$PATH" \
                make check-lean-int LEAN_INT_FLAGS='--jobs 2 --report build/verify/lean-int.json' ;;
          esac
          case "$VERIFY_GROUP" in
            contracts)
              PATH="$lean_boundary_dir/lean-4.35.0-linux/bin:$PATH" \
                make check-lean-guards LEAN_GUARD_FLAGS='--jobs 2 --report build/verify/lean-guards.json tools/lean_boundary/examples/null_guards.py tools/lean_boundary/examples/union_guards.py' ;;
          esac
          case "$VERIFY_GROUP" in
            opt-in|scaling)
              PATH="$lean_boundary_dir/lean-4.35.0-linux/bin:$PATH" \
                make check-lean-storage LEAN_STORAGE_FLAGS='--jobs 2 --report build/verify/lean-storage.json' ;;
          esac

      - name: Require C, embedding and extension FFI coverage
        if: matrix.group == 'contracts'
        run: |
          test -s build/verify/ffi.log
          if grep -Fq '; skipped:' build/verify/ffi.log; then
            cat build/verify/ffi.log
            echo 'Native Linux verification requires every advertised FFI mode' >&2
            exit 1
          fi

      - name: Native thread stack-size edge cases, the native stack's floor and ABI controls
        if: matrix.group == 'contracts'
        run: |
          python3 -m unittest discover -s tools -p test_runtime_thread.py
          python3 -m unittest discover -s tools -p test_stack_floor.py
          python3 -m unittest discover -s tools -p test_runtime_signatures.py

      # Keep the existing hosted ASan controls out of Lint's 15-minute budget.
      # setup.sh already validates LLVM; compiler-rt supplies the runtime and preload library.
      - name: Generated user and runtime ASan controls
        if: matrix.group == 'contracts' && matrix.machine == 'x86_64'
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
          python3 -m unittest discover -s tools -p test_runtime_asan.py -v

      - name: Sanitized shared and object JIT linkage controls
        if: matrix.group == 'ubsan-0' || matrix.group == 'safety-1'
        run: python3 -m unittest discover -s tools -p test_runtime_ubsan.py

      - name: Native program cache invalidation and execution
        # Full runs keep this independent probe on both architectures' runtime-cache jobs.
        # Pull requests run it in the first native JIT worker (pr-variants), the shortest job.
        if: matrix.group == 'runtime-cache'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make test-program-cache PROGRAM_CACHE_COMPILER=build/verify/pystachy2

      - name: Extended subset benchmark correctness
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make bench-extended-check BENCH_COMPILER=build/verify/pystachy2

      - name: Adapted pyperformance benchmark correctness
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make bench-pyperformance-check BENCH_COMPILER=build/verify/pystachy2

      - name: Bounded match dispatch correctness
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make bench-match-check BENCH_COMPILER=build/verify/pystachy2

      - name: Shared pytest example assertions
        if: matrix.group == 'hosted'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make test-pytest-workloads PYTEST_WORKLOAD_COMPILER=build/verify/pystachy2 PYTEST_WORKLOAD_ARGS='--group examples'

      # Retain the hosted compiler and original pytest oracle without using Lint's budget.
      - name: Generated native pytest runner parity
        if: matrix.group == 'hosted' && matrix.machine == 'x86_64'
        run: make test-pytest-native

      # tools/setup.sh installs both of Ubuntu's LP64 libblas.so.3 providers: OpenBLAS
      # (libopenblas0-pthread), checked on one thread, and the reference BLAS (libblas3).
      # LD_LIBRARY_PATH selects each in turn; NumPy is check_blas.py's reference
      - name: Optional BLAS adapter and nanoGPT fused-linear correctness
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
          BLAS_MACHINE: ${{ matrix.machine }}
        run: |
          python3 -m pip install numpy==2.5.4
          OPENBLAS_NUM_THREADS=1 LD_LIBRARY_PATH=/usr/lib/"$BLAS_MACHINE"-linux-gnu/openblas-pthread \
            make blas-check BENCH_COMPILER=build/verify/pystachy2
          LD_LIBRARY_PATH=/usr/lib/"$BLAS_MACHINE"-linux-gnu/blas make blas-check BENCH_COMPILER=build/verify/pystachy2

      - name: Upstream large regex (JIT and AOT, normal GC)
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make port-check-large PORT_COMPILER=build/verify/pystachy2

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.machine }}-verification-${{ matrix.group }}
          path: |
            build/pyperformance-smoke.json
            build/match-dispatch-smoke.json
            build/pytest-pyperformance.json
            build/pytest-workloads.json
            build/pytest-native/examples.json
            build/pytest-native-aot/examples.json
            build/pytest-controls.json
            build/pytest-upstream-bundled.json
            build/verification.json
            build/extended-smoke.json
            build/program-cache-checks.json
            build/verify/*.log
            build/verify/example-cli.json
            build/verify/dynany-fuzz/*.py
            build/verify/dynany-optin-*.json
            build/verify/lean-corpus.json
            build/verify/lean-int.json
            build/verify/lean-storage.json
            build/verify/lean-guards.json
            build/verify/dynany-optin-*/tests/programs/*/*
            build/verify/python-int-optin-*.json
            build/verify/python-int-optin-*/tests/programs/*/*
            build/verify/python-int-optin-*/evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  pr-variants:
    name: native JIT and variants (worker ${{ matrix.worker }})
    if: github.event_name == 'pull_request' && needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code'
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1]
    env:
      VERIFY_PROFILE: pr
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      CI_BASE_SHA: ${{ needs.bootstrap.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - run: tools/setup.sh --minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap
      # Keep two workers per execution mode and the same total job count. JIT finishes before
      # these workers run their existing sparse configurations; AOT has its own two workers.
      - name: Complete native JIT corpus half
        env:
          VARIANT_WORKER: ${{ matrix.worker }}
          VERIFY_BOOTSTRAP_DIR: build/ci-bootstrap
        run: tests/verify.sh "native-jit-$VARIANT_WORKER"
      - name: Upload native JIT report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: x86_64-verification-native-jit-${{ matrix.worker }}
          path: |
            build/verification.json
            build/verify/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Sampled configurations on representative and changed cases
        env:
          VARIANT_WORKER: ${{ matrix.worker }}
          VERIFY_BOOTSTRAP_DIR: build/ci-bootstrap
        run: python3 tools/pr_variants.py --worker "$VARIANT_WORKER"
      # The contracts and cache/GC jobs took up to 13.5 minutes on EPYC 7763 runners, these
      # workers about 3.5 (#1178): the first runs the PR's program-cache probe, with the stage-2
      # compiler its JIT half restored. The second takes the runtime controls out of Lint.
      - name: Native program cache invalidation and execution
        if: matrix.worker == 0
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make test-program-cache PROGRAM_CACHE_COMPILER=build/verify/pystachy2
      - name: Runtime ABI and GC root checker controls
        if: matrix.worker == 1
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-rt-18-dev
          # Generated-code ASan controls run in the existing x86 contracts job.
          PYSTACHY_CACHE_TEST_LLVM="$PYSTACHY_LLVM" python3 - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.discover("tools", pattern=path.name)
              for path in sorted(Path("tools").glob("test_runtime_*.py"))
              if path.name != "test_runtime_asan.py"
          )
          raise SystemExit(not unittest.TextTestRunner().run(suite).wasSuccessful())
          PY
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh '-fsanitize=address,undefined'
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh --negative-control '-fsanitize=address,undefined'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: pr-variants-${{ matrix.worker }}
          path: |
            build/variants
            build/program-cache-checks.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  distribution:
    name: distribution (${{ matrix.os }})
    if: github.event_name == 'pull_request' && needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code'
    needs: bootstrap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements-packaging.txt
      - run: tools/setup.sh --minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: runner.os == 'Linux'
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap
      - name: Reuse verified Linux compiler
        if: runner.os == 'Linux'
        env:
          PYSTACHY_LLVM: /usr/lib/llvm-18/bin
        run: |
          python3 tools/verification_bootstrap.py restore build/ci-bootstrap
          cp build/verify/pystachy2 pystachy
      - name: Bootstrap on macOS ARM64
        if: runner.os == 'macOS'
        run: make
      - name: Installer and hosted/native JIT/AOT smoke
        run: |
          tools/setup.sh --check
          make test-install
          python3 tools/install_smoke.py
      - name: Install sanitizer runtime for netio ownership
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - name: Hosted and native epoll, pipes and ownership
        id: netio_linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          PYSTACHY_LLVM: /usr/lib/llvm-18/bin
        run: |
          test -x ./pystachy
          python3 -m unittest discover -s tools -p 'test_netio*.py'
          python3 examples/netio/benchmark.py --cpython-only --smoke --json build/netio-linux-benchmark-smoke.json
          python3 examples/netio/check.py --compiler 'python3 pystachy.py' --repeat 2 --json build/netio-linux-hosted.json
          python3 examples/netio/check_drain.py --compiler 'python3 pystachy.py' --json build/netio-linux-drain-hosted.json
          mkdir -p build/netio
          "$PYSTACHY_LLVM/clang" -std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            examples/netio/netio.c examples/netio/ownership.c -o build/netio/ownership
          ASAN_OPTIONS=detect_leaks=1 build/netio/ownership
          python3 examples/netio/check.py --compiler ./pystachy --repeat 2 --json build/netio-linux-native.json
          python3 examples/netio/check_drain.py --compiler ./pystachy --json build/netio-linux-drain-native.json
      - name: Retain Linux netio reports
        if: always() && runner.os == 'Linux' && steps.netio_linux.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: netio-linux-pr-${{ matrix.os }}
          path: build/netio-linux*.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Native kqueue and pipe parity
        id: netio
        if: matrix.os == 'macos-15'
        timeout-minutes: 5
        env:
          PYSTACHY_LLVM: /opt/homebrew/opt/llvm@20/bin
        run: |
          test -x ./pystachy
          python3 examples/netio/check.py --compiler ./pystachy --repeat 1 --timeout 30 \
            --build-timeout 120 --json build/netio-macos.json
          python3 examples/netio/check_drain.py --compiler ./pystachy --timeout 30 \
            --json build/netio-drain-macos.json
      - name: Retain native kqueue reports
        if: always() && matrix.os == 'macos-15' && steps.netio.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: netio-kqueue-pr-${{ matrix.os }}
          path: |
            build/netio-macos.json
            build/netio-drain-macos.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
      - name: Install the compiler with pip and uv
        env:
          PYSTACHY_LLVM: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/llvm@20/bin' || '/usr/lib/llvm-18/bin' }}
        run: |
          python3 -m pip install -r tools/requirements-packaging.txt
          python3 tools/compiler_install_smoke.py
      - name: Source packages and native release archive smoke
        if: runner.os == 'Linux'
        run: |
          python3 tools/package_smoke.py --no-build-isolation
          python3 tools/package_smoke.py --no-build-isolation --compiler 'python3 pystachy.py'
          python3 -m unittest discover -s tools -p 'test_release*.py'
          release_version=$(cat VERSION)
          test -f "docs/releases/$release_version.md"
          python3 tools/release.py --version "$release_version" --target linux-x86_64 --output-dir build/release-smoke
          python3 tools/release_smoke.py "build/release-smoke/pystachy-$release_version-linux-x86_64.tar.gz"

  verify:
    name: ${{ github.event_name == 'pull_request' && 'Verification' || format('make verify (Linux {0}, LLVM 18, Python 3.13)', matrix.machine == 'aarch64' && 'ARM64' || 'x86-64') }}
    # Report dependency failures, but release the PR concurrency slot on cancellation.
    # always() keeps obsolete summary jobs queued and blocks the replacement run.
    if: ${{ !cancelled() }}
    needs: [bootstrap, verification, pr-variants, distribution]
    runs-on: ubuntu-24.04
    env:
      CI_BASE_SHA: ${{ needs.bootstrap.outputs.base }}
    # Artifact downloads alone have exceeded three minutes on otherwise green runs.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64"]' || '["x86_64","aarch64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code'
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: ${{ !cancelled() && needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code' }}
        with:
          pattern: ${{ matrix.machine }}-verification-*
          path: build/ci-reports

      - name: Require complete verification reports
        if: ${{ !cancelled() && needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code' }}
        env:
          VERIFY_MACHINE: ${{ matrix.machine }}
          VERIFY_PROFILE: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        run: |
          python3 tools/merge_verification.py build/ci-reports --machine "$VERIFY_MACHINE" \
            --profile "$VERIFY_PROFILE" -o build/verification.json

      - name: Require every verification group
        if: ${{ !cancelled() }}
        env:
          X86_PLAN: ${{ needs.bootstrap.outputs.plan_x86_64 }}
          ARM_PLAN: ${{ needs.bootstrap.outputs.plan_aarch64 }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap.result }}
          GROUP_RESULT: ${{ needs.verification.result }}
          VARIANTS_RESULT: ${{ needs.pr-variants.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
        run: |
          python3 tools/ci_gate.py require-jobs "$GITHUB_EVENT_NAME" "$X86_PLAN" "$ARM_PLAN" \
            "$BOOTSTRAP_RESULT" "$GROUP_RESULT" "$VARIANTS_RESULT" "$DISTRIBUTION_RESULT"

      - name: Upload combined verification report
        if: ${{ !cancelled() && needs.bootstrap.outputs.plan_x86_64 == 'code' && needs.bootstrap.outputs.plan_aarch64 == 'code' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.machine }}-verification
          path: build/verification.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

# Every original verification stage runs on every commit, in independent groups. Each group
# builds and checks its own bootstrap fixed point; no compiler/runtime cache crosses a run.
# The final gate retains the required check name and rejects missing, failed or cancelled groups.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verification:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # Native checks take ~15 minutes; GC self-compilation has its own 30-minute bound.
    # Leave room for bootstrap, runner variation and uploading failure diagnostics.
    timeout-minutes: ${{ matrix.group == 'gc-stress' && 40 || matrix.group == 'native' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        group: [hosted, native, python-free, ubsan, gc-stress, contracts, benchmarks]
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the tests run arbitrary programs: no token for them to read

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 toolchain
        run: tools/setup.sh

      - name: Verify group
        env:
          VERIFY_GROUP: ${{ matrix.group }}
        run: tests/verify.sh "$VERIFY_GROUP"

      - name: Extended subset benchmark correctness
        if: matrix.group == 'benchmarks'
        env:
          PYSTACHY_HOME: ${{ github.workspace }}
        run: make bench-extended-check BENCH_COMPILER=build/verify/pystachy2

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verification-${{ matrix.group }}
          path: |
            build/verification.json
            build/extended-smoke.json
            build/verify/*.log
          if-no-files-found: error
          retention-days: 7

  port-check:
    name: upstream port preservation (CPython)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: make port-check
      - name: Upload port report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: port-check
          path: build/port-check.json
          if-no-files-found: warn
          retention-days: 7

  upstream-large:
    name: upstream large regex (JIT and AOT, normal GC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: tools/setup.sh
      - run: make port-check-large

  verify:
    name: make verify (Linux x86-64, LLVM 18, Python 3.13)
    if: always()
    needs: [verification, port-check, upstream-large]
    runs-on: ubuntu-24.04
    # Artifact downloads alone have exceeded three minutes on otherwise green runs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        if: always()
        with:
          pattern: verification-*
          path: build/ci-reports

      - name: Require complete verification reports
        if: always()
        run: python3 tools/merge_verification.py build/ci-reports -o build/verification.json

      - name: Require every verification group
        if: always()
        env:
          GROUP_RESULT: ${{ needs.verification.result }}
          PORT_RESULT: ${{ needs.port-check.result }}
          LARGE_RESULT: ${{ needs.upstream-large.result }}
        run: |
          test "$GROUP_RESULT" = success
          test "$PORT_RESULT" = success
          test "$LARGE_RESULT" = success

      - name: Upload combined verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verification
          path: build/verification.json
          if-no-files-found: warn
          retention-days: 7

# Validate the documented source install on Linux and both macOS architectures.
# Full verification retains its separate Linux x86-64 gate.
name: Installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: install-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 llvm-18-runtime

      - name: LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@20

      - name: Check dependencies and installer
        run: |
          tools/setup.sh --check
          make test-install

      - name: Bootstrap fixed point
        run: make

      - name: Hosted and native JIT/AOT smoke
        run: python3 tools/install_smoke.py

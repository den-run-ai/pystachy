# Validate the documented source install on both Linux and macOS architectures.
# Full verification retains its separate Linux x86-64 and ARM64 gates.
name: Installation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: install-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: LLVM toolchain (install only when missing)
        run: tools/setup.sh --minimal

      - name: Check dependencies and installer
        run: |
          tools/setup.sh --check
          make test-install

      - name: Bootstrap fixed point
        run: make

      - name: Hosted and native JIT/AOT smoke
        run: python3 tools/install_smoke.py

      - name: Install sanitizer runtime for netio ownership
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev

      - name: Hosted and native epoll, pipes and ownership
        id: netio_linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          PYSTACHY_LLVM: /usr/lib/llvm-18/bin
        run: |
          test -x ./pystachy
          python3 -m unittest discover -s tools -p 'test_netio*.py'
          python3 examples/netio/benchmark.py --cpython-only --smoke --json build/netio-linux-benchmark-smoke.json
          python3 examples/netio/check.py --compiler 'python3 pystachy.py' --repeat 2 --json build/netio-linux-hosted.json
          python3 examples/netio/check_drain.py --compiler 'python3 pystachy.py' --json build/netio-linux-drain-hosted.json
          mkdir -p build/netio
          "$PYSTACHY_LLVM/clang" -std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            examples/netio/netio.c examples/netio/ownership.c -o build/netio/ownership
          ASAN_OPTIONS=detect_leaks=1 build/netio/ownership
          python3 examples/netio/check.py --compiler ./pystachy --repeat 2 --json build/netio-linux-native.json
          python3 examples/netio/check_drain.py --compiler ./pystachy --json build/netio-linux-drain-native.json

      - name: Retain Linux netio reports
        if: always() && runner.os == 'Linux' && steps.netio_linux.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: netio-linux-install-${{ matrix.os }}
          path: build/netio-linux*.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Native kqueue and pipe parity
        id: netio
        if: matrix.os == 'macos-15'
        timeout-minutes: 5
        env:
          PYSTACHY_LLVM: /opt/homebrew/opt/llvm@20/bin
        run: |
          test -x ./pystachy
          python3 examples/netio/check.py --compiler ./pystachy --repeat 1 --timeout 30 \
            --build-timeout 120 --json build/netio-macos.json
          python3 examples/netio/check_drain.py --compiler ./pystachy --timeout 30 \
            --json build/netio-drain-macos.json

      - name: Retain native kqueue reports
        if: always() && matrix.os == 'macos-15' && steps.netio.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: netio-kqueue-install-${{ matrix.os }}
          path: |
            build/netio-macos.json
            build/netio-drain-macos.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  provision:
    name: Source install with pinned LLVM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install from the exact Git commit and exercise the provisioned toolchain
        run: |
          python3 -m pip install -r tools/requirements-packaging.txt
          python3 tools/compiler_install_smoke.py \
            --source "pystachy @ git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git@${GITHUB_SHA}" \
            --revision "$GITHUB_SHA" --provision-llvm

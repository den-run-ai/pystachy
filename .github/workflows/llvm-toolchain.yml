# Trial only, not for merging: the pinned archives on glibc 2.28, the oldest C library that source
# builds are checked on. Each archive is the one an earlier trial run built and kept as an artifact.
name: LLVM toolchain

on:
  push:
    branches: [claude/gracious-cannon-a68uaf-trial]

concurrency:
  group: llvm-toolchain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IMAGE: quay.io/pypa/manylinux_2_28@sha256:834a11a02642a46e580b62f25f5b04588355092c8677eaf0393e3ea1997001a3
  ARCHIVES_RUN: "44777759298"

jobs:
  source:
    name: trial - source build on glibc 2.28 with the archive (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: pystachy-llvm-linux-${{ matrix.arch }}
          path: serve
          run-id: ${{ env.ARCHIVES_RUN }}
          github-token: ${{ github.token }}

      - name: The archive is the pinned one
        run: |
          (cd serve && sha256sum -c ./*.sha256)
          python3 - "$ARCH" serve/pystachy-llvm-*.tar.xz <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          import pystachy_toolchain as toolchain

          machine, archive = sys.argv[1], Path(sys.argv[2])
          assert archive.name == toolchain.minimal_archive(machine) + ".tar.xz", archive.name
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == toolchain.MINIMAL_SHA256[machine]
          print(archive.name, "is the pinned archive; the download's floor is glibc", toolchain.MINIMAL_GLIBC)
          PY
          mkdir "$RUNNER_TEMP/llvm"
          tar -xJf serve/pystachy-llvm-*.tar.xz -C "$RUNNER_TEMP/llvm" --strip-components=1
          ls "$RUNNER_TEMP/llvm/bin"

      - name: main's check on glibc 2.28 (tools/manylinux_check.sh)
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/llvm:/llvm:ro" -w /src -e PYSTACHY_LLVM=/llvm/bin \
            "$IMAGE" tools/manylinux_check.sh

      # Only the four cases that docs/testing.md names as the system's may fail.
      - name: The whole corpus there, JIT and AOT
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/llvm:/llvm:ro" -w /src -e PYSTACHY_LLVM=/llvm/bin \
            "$IMAGE" sh -c 'export PATH=/opt/python/cp311-cp311/bin:$PATH
              tests/run.sh ./pystachy "jit aot" > build/manylinux/full.log 2>&1; echo "tests/run.sh: exit $?"'
          grep '^FAIL' build/manylinux/full.log | sort || true
          tail -1 build/manylinux/full.log
          grep -q ' passed, ' build/manylinux/full.log
          for name in $(grep '^FAIL' build/manylinux/full.log | sed 's/^FAIL \([^ ]*\) .*/\1/' | sort -u); do
            case "$name" in
              exec_signal|float_power_rounding|lib_statistics|upstream_math_testfiles) ;;
              *) echo "unexpected failure: $name"; grep -A12 "^FAIL $name " build/manylinux/full.log | head -60; exit 1 ;;
            esac
          done

  # The download where a host has no LLVM, this runner standing in for the release.
  smoke:
    name: trial - download on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ["almalinux:8", "rockylinux:8"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: pystachy-llvm-linux-${{ matrix.arch }}
          path: serve
          run-id: ${{ env.ARCHIVES_RUN }}
          github-token: ${{ github.token }}

      - name: Install with pip and uv in the container and compile with the downloaded toolchain
        env:
          DISTRIBUTION: ${{ matrix.image }}
        run: |
          (cd serve && sha256sum -c ./*.sha256)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          sed -i 's#"https://github.com/den-run-ai/pystachy/releases/download"#"http://127.0.0.1:8765"#; s#f"/llvm-toolchain-{MINIMAL_VERSION}-{MINIMAL_REVISION}"#""#' pystachy_toolchain.py
          grep -n -A3 "^MINIMAL_RELEASE" pystachy_toolchain.py
          docker run --rm --network host -v "$PWD:/src:ro" "$DISTRIBUTION" sh /src/.github/trial-smoke.sh
          cat "$RUNNER_TEMP/serve.log"

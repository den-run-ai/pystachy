name: Temporary ARM listprobe diagnosis

on:
  push:
    branches: [codex/alpha6-arm-listprobe-diagnostic]

concurrency:
  group: arm-listprobe-diagnostic-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PYSTACHY_JOBS: '2'
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal
      - name: Check diagnostic harness
        run: python3 -m unittest discover -s tools -p test_arm_listprobe_diagnostic.py
      - name: Repeat original and instrumented ARM probes
        run: python3 tools/arm_listprobe_diagnostic.py --repetitions 24
      - name: Preserve every diagnostic outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: arm-listprobe-diagnostic-${{ github.sha }}
          path: build/arm-listprobe-diagnostic/
          if-no-files-found: error
          retention-days: 7


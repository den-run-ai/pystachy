# Other CPython versions (docs/testing.md#other-cpython-versions): under each, the hosted compiler must
# emit the verified bootstrap's IR for itself and runtime.py and pass a corpus sample in JIT and AOT,
# and the FFI suite must pass with that CPython's libpython (tools/python_versions.sh); pip and uv
# install the compiler with it (tools/compiler_install_smoke.py). Daily, on
# demand and on relevant pushes to main: pull requests keep their 19-job budget.
name: Python versions

on:
  schedule:
    - cron: '41 7 * * *'   # daily, 07:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/python-versions.yml
      - .python-version
      - lib/pyobj.py
      - pyembed.c
      - pyext.c
      - pyproject.toml
      - tests/ffi/**
      - tools/compiler_install_smoke.py
      - tools/python_versions.sh
      - tools/requirements-packaging.txt
      - tools/rt_cpython/**
      - tools/verification_bootstrap.py
concurrency:
  group: python-versions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: verified compiler producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      PYSTACHY_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal
      - name: Verify compiler and runtime fixed points
        run: tests/verify.sh bootstrap
      - name: Package verified bootstrap
        run: python3 tools/verification_bootstrap.py export build/ci-bootstrap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  python:
    needs: bootstrap
    name: CPython ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each minor release that .python-version (the oracle, which CI tests) does not name,
        # pinned like it; a t marks the free-threaded build
        python: ['3.11.18', '3.12.16', '3.14.10', '3.14.10t', '3.15.2', '3.15.2t']
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
      PYSTACHY_JOBS: '4'
      PYSTACHY_HOME: ${{ github.workspace }}
      COMPILER: ${{ github.workspace }}/build/verify/pystachy2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # the tests run arbitrary programs: no token for them to read

      # The bootstrap's Python, which restoring it checks
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version

      - name: LLVM 18 toolchain
        run: tools/setup.sh --minimal

      # No run-id or token: only a producer in this workflow run can supply the compiler.
      - name: Download verified bootstrap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: verified-bootstrap-x86_64
          path: build/ci-bootstrap
      - name: Validate and restore the native compiler
        run: python3 tools/verification_bootstrap.py restore build/ci-bootstrap

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: target
        with:
          python-version: ${{ matrix.python }}

      - name: tools/python_versions.sh (make python-versions)
        env:
          TARGET: ${{ steps.target.outputs.python-path }}
        run: tools/python_versions.sh "$TARGET" "$COMPILER" build/verify

      # The pip and uv installation outside the checkout, with this CPython (Installation runs it
      # with the pinned one)
      - name: tools/compiler_install_smoke.py
        env:
          TARGET: ${{ steps.target.outputs.python-path }}
        run: |
          "$TARGET" -m pip install -r tools/requirements-packaging.txt
          "$TARGET" tools/compiler_install_smoke.py

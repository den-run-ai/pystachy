name: Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  packages:
    name: source wheels (CPython, JIT and AOT)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - run: tools/setup.sh --minimal
      - run: python3 -m pip install uv==0.12.23 setuptools==84.0.0 wheel==0.48.0
      - run: make
      - run: python3 tools/package_smoke.py --no-build-isolation
      - run: python3 tools/package_smoke.py --no-build-isolation --compiler 'python3 pystachy.py'

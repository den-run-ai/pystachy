name: Packages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One group per main commit, as in CI, Installation and Lint: the release gate requires each
# commit's own run, and a shared main group cancelled a pending run when a later push queued.
concurrency:
  group: packages-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  packages:
    name: source wheels (CPython, JIT and AOT)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version
      - run: tools/setup.sh --minimal
      - run: python3 -m pip install -r tools/requirements-packaging.txt
      - run: make
      - run: python3 tools/package_smoke.py --no-build-isolation
      - run: python3 tools/package_smoke.py --no-build-isolation --compiler 'python3 pystachy.py'

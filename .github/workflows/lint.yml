# make lint: ruff (findings only), shellcheck of the scripts as POSIX sh, and clang's warnings on
# runtime.c and tools/dictprobe.c, with the versions of tools/requirements-dev.txt; then make
# check-recordings (tests/record.sh --check): the CPython of .python-version, which recorded the
# tests' expected output (with the typing_extensions of tools/requirements-dev.txt), still prints
# every recording, every deviation still deviates from it, lib/'s copies are its files, and no
# *.rej, *.orig or core file lies in the tree. A minute or two, beside CI's make verify, on the same
# events: pull requests (forks too), pushes to main, and on demand.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: make lint (ruff, shellcheck, clang -Wall -Wextra)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version   # the CPython the tests' expected output was recorded with

      - run: python3 -m pip install -r tools/requirements-dev.txt

      - run: make lint

      - name: CI report gate tests
        run: python3 -m unittest discover -s tools -p test_merge_verification.py

      - name: Router benchmark validation tests
        run: python3 -m unittest discover -s tools -p test_route_bench.py

      - run: make check-recordings

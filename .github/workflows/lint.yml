# actionlint validates workflows and embedded shell; make check-fast runs ruff, mypy and hosted unit
# tests; make lint adds shellcheck of the scripts as POSIX sh and clang's warnings on
# runtime.c and tools/dictprobe.c, with the versions of tools/requirements-dev.txt; then make
# check-recordings (tests/record.sh --check): the CPython of .python-version, which recorded the
# tests' expected output (with the typing_extensions of tools/requirements-dev.txt), still prints
# every recording, every deviation still deviates from it, lib/'s copies are its files, and no
# *.rej, *.orig or core file lies in the tree. A minute or two, beside CI's make verify, on the same
# events: pull requests (forks too, and documentation-only ones, which skip CI), pushes to main,
# and on demand.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: make lint (ruff, shellcheck, clang -Wall -Wextra)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version   # the CPython the tests' expected output was recorded with
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - run: python3 -m pip install -r tools/requirements-dev.txt

      - name: Validate GitHub Actions workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          actionlint_dir=$(mktemp -d)
          trap 'rm -rf "$actionlint_dir"' EXIT
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          command -v shellcheck >/dev/null
          "$actionlint_dir/actionlint" -pyflakes=

      - name: Fast hosted checks and full lint
        run: make check-fast lint

      - name: CI verification harness and report gate tests
        run: python3 -m unittest discover -s tools -p 'test_*verif*.py'

      - name: Router benchmark validation tests
        run: python3 -m unittest discover -s tools -p test_route_bench.py

      - name: Install sanitizer runtime for generated-code controls
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev

      - name: Runtime ABI, ASan and GC root checker controls
        run: python3 -m unittest discover -s tools -p 'test_runtime_*.py'

      - name: pyperformance runner and port record tests
        run: python3 -m unittest discover -s tools -p test_bench_pyperformance.py

      - name: Performance smoke comparison tests
        run: python3 -m unittest discover -s tools -p test_perf_smoke.py

      - name: nanoGPT parity checker contract tests
        run: python3 -m unittest discover -s tools -p test_check_nanogpt.py

      - name: Import sweep provenance and argument tests
        run: python3 -m unittest discover -s tools -p test_import_sweep.py

      - name: Dynamic Any fuzzer generator and comparison tests
        run: python3 -m unittest discover -s tools -p test_dynany_fuzz.py

      - name: Dynamic Any builtin call binding tests
        run: python3 -m unittest discover -s tools -p test_dynany_calls.py

      - name: Dynamic Any corpus sweep controls
        run: python3 -m unittest discover -s tools -p test_dynany_optin.py

      - name: Promoting int tooling and retry controls
        run: python3 -m unittest discover -s tools -p 'test_python_int*.py'

      - name: microGPT graph parity and benchmark contract tests
        run: python3 -m unittest discover -s tools -p test_bench_microgpt.py

      - name: Integer benchmark checksum agreement tests
        run: python3 -m unittest discover -s tools -p test_bench_integers.py

      - name: Compiler function-state lists (Gen, Frame, gen_save, gen_restore, gen_enter)
        run: python3 -m unittest discover -s tools -p test_frame_fields.py

      - name: Compiler state contract controls
        run: python3 -m unittest discover -s tools -p 'test_compiler_state*.py'

      - name: JSON benchmark evidence tests
        run: python3 -m unittest discover -s tools -p test_bench_json.py

      - name: LLVM IR diagnostic inventory tests
        run: python3 -m unittest discover -s tools -p test_ir_cost_report.py

      - name: DCO certification check tests
        run: python3 -m unittest discover -s tools -p test_dco_check.py

      - name: Coverage report checks tests
        run: python3 -m unittest discover -s tools -p test_coverage_report.py

      - name: Workflow job time limits (at most 15 minutes)
        run: python3 -m unittest discover -s tools -p test_workflow_limits.py

      - name: Generated regex matcher tests
        run: python3 -m unittest discover -s tools -p test_re_specialize.py

      - name: Concurrency contract probes (docs/concurrency.md)
        run: python3 -m unittest discover -s tools -p test_concurrency_contract.py

      - run: make check-recordings

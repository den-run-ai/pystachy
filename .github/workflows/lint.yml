# actionlint validates workflows and embedded shell; make check-fast runs ruff, mypy and hosted unit
# tests; make lint adds shellcheck of the scripts as POSIX sh and clang's warnings on
# runtime.c and tools/dictprobe.c, with the versions of tools/requirements-dev.txt; then make
# check-recordings (tests/record.sh --check): the CPython of .python-version, which recorded the
# tests' expected output (with the typing_extensions of tools/requirements-dev.txt), still prints
# every recording, every deviation still deviates from it, lib/'s copies are its files, and no
# *.rej, *.orig or core file lies in the tree. A minute or two, beside CI's make verify, on the same
# events: pull requests (forks too, and documentation-only ones), pushes to main,
# and on demand.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: make lint (ruff, shellcheck, clang -Wall -Wextra)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYSTACHY_LLVM: /usr/lib/llvm-18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .python-version   # the CPython the tests' expected output was recorded with
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - run: python3 -m pip install -r tools/requirements-dev.txt

      - name: Select Lean boundary validation
        id: lean-boundary
        run: |
          # PR checkout is the synthetic merge: its first parent is the base,
          # so this compares the whole PR, including earlier commits. Missing
          # merge history fails safe; main pushes and manual runs always check.
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
              ! git rev-parse --verify 'HEAD^2^{commit}' >/dev/null 2>&1 ||
              ! git diff --quiet HEAD^ HEAD -- tools/lean_boundary tools/check_lean_boundary.py \
                'tools/test_lean_boundary*.py' src pystachy.py tools/inspect_compiler.py \
                Makefile .github/workflows/lint.yml tools/requirements-dev.txt .python-version; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build, audit and test the Lean boundary prototype
        if: steps.lean-boundary.outputs.run == 'true'
        run: |
          lean_boundary_dir=$(mktemp -d)
          trap 'rm -rf "$lean_boundary_dir"' EXIT
          curl --fail --location --silent --show-error --retry 2 --retry-max-time 240 \
            --connect-timeout 20 --max-time 120 \
            'https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst' \
            --output "$lean_boundary_dir/lean.tar.zst"
          printf '%s  %s\n' '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d' \
            "$lean_boundary_dir/lean.tar.zst" | sha256sum --check -
          tar --no-same-owner --zstd -xf "$lean_boundary_dir/lean.tar.zst" -C "$lean_boundary_dir"
          PATH="$lean_boundary_dir/lean-4.35.0-linux/bin:$PATH" make check-lean-boundary

      - name: Validate GitHub Actions workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          actionlint_dir=$(mktemp -d)
          trap 'rm -rf "$actionlint_dir"' EXIT
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$actionlint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$actionlint_dir/actionlint.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          command -v shellcheck >/dev/null
          "$actionlint_dir/actionlint" -pyflakes=

      - name: Fast hosted checks and full lint
        run: make check-fast lint

      - name: Retained IR and failed native build controls
        run: |
          PYSTACHY_TEST_LLVM="$PYSTACHY_LLVM" python3 -m unittest discover -s tools -p test_retained_ir.py
          PYSTACHY_TEST_LLVM="$PYSTACHY_LLVM" python3 -m unittest discover -s tools -p test_bootstrap_tier.py

      - name: Verification harness and compiler state controls
        run: |
          python3 -m unittest discover -s tools -p test_lint_controls.py
          python3 tools/lint_controls.py 'test_*verif*.py' 'test_compiler_state*.py'

      - name: Compact CI sampling and variant controls
        run: |
          python3 -m unittest discover -s tools -p 'test_ci_*.py'
          python3 -m unittest discover -s tools -p 'test_pr_*.py'

      - name: Upstream port preservation (CPython)
        run: make port-check

      - name: Router benchmark validation tests
        run: python3 -m unittest discover -s tools -p test_route_bench.py

      - name: Example benchmark validation tests
        run: python3 -m unittest discover -s tools -p test_example_bench.py

      - name: Example CLI smoke contract tests
        run: python3 -m unittest discover -s tools -p test_check_example_cli.py

      - name: Native text reads on open pipes
        run: PYSTACHY_TEXT_READ_COMPILER='python3 -m pystachy' python3 -m unittest discover -s tools -p test_text_read_progress.py
      - name: Owned communication buffer and completion checks
        run: |
          python3 -m unittest discover -s tools -p 'test_comm_*.py'
          python3 examples/comm/check.py --compiler 'python3 -m pystachy' --cc "$PYSTACHY_LLVM/clang" --sanitizers --leak-check

      - name: Install sanitizer runtime for native controls
        run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev

      - name: Runtime ABI and GC root checker controls
        run: |
          # Generated-code ASan controls run in the existing x86 contracts job.
          PYSTACHY_CACHE_TEST_LLVM="$PYSTACHY_LLVM" python3 - <<'PY'
          from pathlib import Path
          import unittest
          suite = unittest.TestSuite(
              unittest.defaultTestLoader.discover("tools", pattern=path.name)
              for path in sorted(Path("tools").glob("test_runtime_*.py"))
              if path.name != "test_runtime_asan.py"
          )
          raise SystemExit(not unittest.TextTestRunner().run(suite).wasSuccessful())
          PY
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh '-fsanitize=address,undefined'
          PY=python3 CC="$PYSTACHY_LLVM/clang" ASAN_OPTIONS=detect_leaks=1 \
            tools/check_cpu_buffers.sh --negative-control '-fsanitize=address,undefined'

      - name: pyperformance runner and port record tests
        run: python3 -m unittest discover -s tools -p test_bench_pyperformance.py

      - name: Performance smoke comparison tests
        run: python3 -m unittest discover -s tools -p test_perf_smoke.py

      - name: nanoGPT parity checker contract tests
        run: python3 -m unittest discover -s tools -p test_check_nanogpt.py

      - name: Import sweep and PyPI probe tests
        run: |
          python3 -m unittest discover -s tools -p test_import_sweep.py
          python3 -m unittest discover -s tools -p 'test_pypi_*.py'

      - name: CPython test-method extraction tests
        run: python3 -m unittest discover -s tools -p test_cpython_test_methods.py

      - name: Generated native pytest runner parity
        run: make test-pytest-native

      - name: Dynamic Any fuzzer generator and comparison tests
        run: python3 -m unittest discover -s tools -p test_dynany_fuzz.py

      - name: Dynamic Any builtin call binding tests
        run: python3 -m unittest discover -s tools -p test_dynany_calls.py

      - name: Dynamic Any corpus sweep controls
        run: python3 -m unittest discover -s tools -p test_dynany_optin.py

      - name: Promoting int tooling and retry controls
        run: python3 -m unittest discover -s tools -p 'test_python_int*.py'

      - name: Function-local join retry controls
        run: python3 -m unittest discover -s tools -p test_local_join_retry.py

      - name: microGPT graph parity and benchmark contract tests
        run: python3 -m unittest discover -s tools -p test_bench_microgpt.py

      - name: Integer benchmark checksum agreement tests
        run: python3 -m unittest discover -s tools -p test_bench_integers.py

      - name: Compiler function-state lists (Gen, Frame, gen_save, gen_restore, gen_enter)
        run: python3 -m unittest discover -s tools -p test_frame_fields.py

      - name: JSON benchmark evidence tests
        run: python3 -m unittest discover -s tools -p test_bench_json.py

      - name: LLVM IR diagnostic inventory tests
        run: python3 -m unittest discover -s tools -p test_ir_cost_report.py

      - name: Issue and PR reading budgets and metadata checks
        run: python3 -m unittest discover -s tools -p test_submission.py

      - name: Coverage report checks tests
        run: python3 -m unittest discover -s tools -p test_coverage_report.py

      - name: PR job budget (20 jobs, two workers per group, 15 minutes each)
        run: python3 -m unittest discover -s tools -p test_workflow_limits.py

      - name: Linux ELF compatibility audit controls
        run: python3 -m unittest discover -s tools -p test_linux_abi.py

      - name: Installed JSON repair wheel validation controls
        run: python3 -m unittest discover -s tools -p test_json_repair_wheel.py

      - name: Generated regex matcher tests
        run: python3 -m unittest discover -s tools -p test_re_specialize.py

      - name: Concurrency contract and local process ownership controls
        run: |
          python3 -m unittest discover -s tools -p test_concurrency_contract.py
          python3 -m unittest discover -s tools -p 'test_process_worker*.py'

      - name: Native program cache manifests and tool inputs
        run: |
          python3 -m unittest discover -s tools -p 'test_program_cache*.py'
          python3 -m unittest discover -s tools -p 'test_cached_run*.py'
          python3 -m unittest discover -s tools -p test_cache_toolchain.py

      - run: make check-recordings

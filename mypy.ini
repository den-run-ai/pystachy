[mypy]
# Check the hosted compiler and entry point, not intentionally invalid test inputs,
# vendored libraries, or the runtime's compiler-only _rt intrinsics.
files = pystachy.py, src
python_version = 3.11
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
cache_dir = build/mypy

# The compiler reuses unannotated locals with unrelated types in separate paths.
# Keep checking their current types instead of requiring artificial variable names.
allow_redefinition_new = True
local_partial_types = True

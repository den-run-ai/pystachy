[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pystachy-demo"
version = "0.1.0"
description = "A tiny source package shared by CPython and Pystachy"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pystachy-ports==0.1.0"]

[project.scripts]
pystachy-demo = "pystachy_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

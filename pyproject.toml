[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pystachy"
dynamic = ["version"]
description = "Compile a typed subset of Python to native code through LLVM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "ryu/LICENSE-Boost"]
keywords = ["compiler", "llvm", "jit", "aot", "native", "typed python", "extension modules"]
# The CPython versions that .github/workflows/python-versions.yml and CI run the compiler under
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
pystachy = "_pystachy_source.pystachy_cli:main"

[project.urls]
Homepage = "https://github.com/den-run-ai/pystachy"
Documentation = "https://github.com/den-run-ai/pystachy/blob/main/docs/README.md"
Source = "https://github.com/den-run-ai/pystachy"
Issues = "https://github.com/den-run-ai/pystachy/issues"
Changelog = "https://github.com/den-run-ai/pystachy/releases"

[tool.setuptools]
# Keep the checkout layout for hosted compiler imports and cache input paths.
# Avoid installing generic top-level modules such as src or runtime.
packages = ["_pystachy_source"]
package-dir = { _pystachy_source = "." }
include-package-data = false

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
_pystachy_source = [
    "VERSION", "runtime.c", "pyext.c", "pyembed.c", "lljit.c",
    "src/__init__.py", "src/pystachy_compiler/*.py",
    "lib/**/*.py", "lib/*.py", "mpz/*.c", "mpz/*.h", "ryu/*.c", "ryu/*.h",
]

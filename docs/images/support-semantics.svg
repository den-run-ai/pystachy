<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Iteration, errors and objects: additional semantic obligations</title>
  <desc id="desc">Three rows distinguish direct native forms from supported larger contracts. Arrows connect only supported paths. Separate red boxes list unavailable APIs and accepted deviations. Generators and exception unwinding are supported. Through dynamic Any, supported iterators and generators iterate lazily; a generator whose yields cannot become Any values is rejected at compile time, which is distinct from an accepted loop over an object with only __getitem__, which raises TypeError through Any.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#66758a"/></marker></defs>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #18263b; }
    .title { font-size: 29px; font-weight: 700; }
    .sub { font-size: 17px; fill: #45556d; }
    .head { font-size: 20px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 15px; }
    .green { fill: #145232; }
    .yellow { fill: #654800; }
    .red { fill: #812c26; }
    .edge { fill: none; stroke: #66758a; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="40" y="47" class="title">Generators, exceptions and the object model</text>
  <text x="40" y="79" class="sub">Supported paths and their machinery; separate boundaries at right. No measured speed ranking.</text>
  <text x="40" y="119" class="head green">G KEEP · Direct native paths</text>
  <text x="431" y="119" class="head yellow">Y BOUND · Larger contracts</text>
  <text x="822" y="119" class="head red">R GAP · Specific behaviors</text>
  <text x="40" y="151" class="small" font-weight="700">ITERATION</text>
  <rect x="40" y="163" width="338" height="202" rx="14" fill="#e5f4e9" stroke="#248049" stroke-width="2"/>
  <text x="60" y="199" class="head green">Direct iteration</text>
  <text x="60" y="229" class="body green">range / concrete container loops</text>
  <text x="60" y="256" class="body green">Consumer-lowered generator expr.</text>
  <text x="60" y="300" class="body green">No suspended generator required.</text>
  <text x="60" y="337" class="small green">Concrete element types</text>
  <path d="M383 264 H423" class="edge"/>
  <rect x="431" y="163" width="338" height="202" rx="14" fill="#fff4ce" stroke="#ae7b00" stroke-width="2"/>
  <text x="451" y="199" class="head yellow">Suspended generators</text>
  <text x="451" y="229" class="body yellow">yield / yield from</text>
  <text x="451" y="256" class="body yellow">send / throw / close</text>
  <text x="451" y="290" class="body yellow">Frames, roots, resumption, cleanup</text>
  <text x="451" y="320" class="small yellow">Unboxable Any yields: rejected</text>
  <text x="451" y="345" class="small yellow">at compile time, not an accepted FIX</text>
  <rect x="822" y="163" width="338" height="202" rx="14" fill="#fce9e7" stroke="#ba4036" stroke-width="2"/>
  <text x="842" y="199" class="head red">OUT async / frame APIs</text>
  <text x="842" y="229" class="small red">No async generators or introspection</text>
  <text x="842" y="275" class="head red">FIX __getitem__ iteration</text>
  <text x="842" y="302" class="body red">Through Any, raises TypeError.</text>
  <text x="842" y="337" class="small red">#773: CPython iterates by index</text>
  <text x="40" y="413" class="small" font-weight="700">ERRORS AND CLEANUP</text>
  <rect x="40" y="425" width="338" height="183" rx="14" fill="#e5f4e9" stroke="#248049" stroke-width="2"/>
  <text x="60" y="461" class="head green">Calls + local handlers</text>
  <text x="60" y="492" class="body green">Ordinary successful calls</text>
  <text x="60" y="519" class="body green">Local raise → handler branch</text>
  <text x="60" y="573" class="small green">Exception construction can still cost.</text>
  <path d="M383 516 H423" class="edge"/>
  <rect x="431" y="425" width="338" height="183" rx="14" fill="#fff4ce" stroke="#ae7b00" stroke-width="2"/>
  <text x="451" y="461" class="head yellow">Cross-function errors</text>
  <text x="451" y="492" class="body yellow">Native unwinding / LLVM invoke</text>
  <text x="451" y="519" class="body yellow">finally / with cleanup</text>
  <text x="451" y="550" class="small yellow">IR cost even on non-throwing paths;</text>
  <text x="451" y="576" class="small yellow">execution depends on throw frequency.</text>
  <rect x="822" y="425" width="338" height="183" rx="14" fill="#fce9e7" stroke="#ba4036" stroke-width="2"/>
  <text x="842" y="461" class="head red">OUT exception APIs</text>
  <text x="842" y="492" class="body red">Exception groups / except*</text>
  <text x="842" y="519" class="body red">e.args; full traceback attributes</text>
  <text x="842" y="573" class="small red">Uncaught output: a final error line</text>
  <text x="40" y="657" class="small" font-weight="700">OBJECTS AND LOOKUP</text>
  <rect x="40" y="669" width="338" height="183" rx="14" fill="#e5f4e9" stroke="#248049" stroke-width="2"/>
  <text x="60" y="705" class="head green">Known concrete class</text>
  <text x="60" y="736" class="body green">Typed fields and direct method calls</text>
  <text x="60" y="763" class="body green">Predictable layout and call target</text>
  <text x="60" y="817" class="small green">Preserve native storage.</text>
  <path d="M383 760 H423" class="edge"/>
  <rect x="431" y="669" width="338" height="183" rx="14" fill="#fff4ce" stroke="#ae7b00" stroke-width="2"/>
  <text x="451" y="705" class="head yellow">Inheritance + reflection</text>
  <text x="451" y="736" class="body yellow">Single inheritance; properties</text>
  <text x="451" y="763" class="body yellow">Overrides; known-class reflection</text>
  <text x="451" y="817" class="small yellow">Watch compiler work and IR growth.</text>
  <rect x="822" y="669" width="338" height="183" rx="14" fill="#fce9e7" stroke="#ba4036" stroke-width="2"/>
  <text x="842" y="705" class="head red">OUT dynamic object model</text>
  <text x="842" y="736" class="body red">Multiple inheritance</text>
  <text x="842" y="763" class="body red">General metaclasses / lookup hooks</text>
  <text x="842" y="817" class="small red">Runtime-named attribute values</text>
  <text x="40" y="910" class="sub">Arrows add implementation obligations within supported paths. Red boxes mark separate boundaries.</text>
  <text x="40" y="938" class="small">Snapshot 5b49dcf, 29 October 2026 · contracts and evidence: docs/support-surface.md</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1056" viewBox="0 0 1200 1056" role="img" aria-labelledby="title desc">
  <title id="title">Pystachy inside the CPython feature surface</title>
  <desc id="desc">A concrete native core with default int64 and NaN identity limits is nested inside the larger bounded Pystachy surface. Dynamic Any, promoting ints and closed recursive JSON unions are separate prototypes. Experimental Any has local accepted gaps: skipped cross-type comparison bodies, remaining container and generator identity boundaries, and objects with only __getitem__ that raise when iterated. A separate region lists CPython features with no native contract, beside a neutral explicit-interop note. Area is schematic, not a coverage measurement or a parity guarantee.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #18263b; }
    .title { font-size: 30px; font-weight: 700; }
    .sub { font-size: 17px; fill: #45556d; }
    .head { font-size: 20px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 15px; }
    .green { fill: #145232; }
    .yellow { fill: #654800; }
    .red { fill: #812c26; }
  </style>
  <rect width="1200" height="1056" fill="#ffffff"/>
  <text x="38" y="47" class="title">CPython support surface</text>
  <text x="38" y="79" class="sub">Native compilation · schematic subsets · snapshot 9b50a385, 28 October 2026 (Pacific)</text>
  <rect x="38" y="103" width="18" height="18" rx="4" fill="#e5f4e9" stroke="#248049"/>
  <text x="65" y="118" class="body green">G KEEP</text>
  <rect x="219" y="103" width="18" height="18" rx="4" fill="#fff4ce" stroke="#ae7b00"/>
  <text x="246" y="118" class="body yellow">Y BOUND / PROTO</text>
  <rect x="484" y="103" width="18" height="18" rx="4" fill="#fce9e7" stroke="#ba4036"/>
  <text x="511" y="118" class="body red">R GAP: OUT or FIX</text>
  <rect x="20" y="146" width="1160" height="833" rx="22" fill="#f5f7fb" stroke="#c5cfdc" stroke-width="2"/>
  <text x="40" y="179" class="head">CPython feature families (schematic)</text>
  <rect x="40" y="198" width="770" height="757" rx="18" fill="#fff4ce" stroke="#ae7b00" stroke-width="2"/>
  <text x="62" y="233" class="head yellow">Pystachy native surface</text>
  <text x="62" y="260" class="small yellow">Supported restrictions and experimental opt-in are labelled separately.</text>
  <rect x="60" y="283" width="730" height="270" rx="14" fill="#e5f4e9" stroke="#248049" stroke-width="2"/>
  <text x="82" y="319" class="head green">G KEEP · Concrete native core</text>
  <text x="82" y="357" class="head green">Concrete scalars</text>
  <text x="82" y="383" class="body green">Checked int64; float; bool</text>
  <text x="440" y="357" class="head green">Typed container operations</text>
  <text x="440" y="383" class="body green">Concrete keys/items; known shapes</text>
  <text x="82" y="421" class="head green">Predictable storage</text>
  <text x="82" y="447" class="body green">Numeric lists; known class fields</text>
  <text x="440" y="421" class="head green">Direct consumer lowering</text>
  <text x="440" y="447" class="body green">sum(x * x for x in xs)</text>
  <text x="82" y="485" class="head green">Known calls + loops</text>
  <text x="82" y="511" class="body green">Specialized def; if / for / while</text>
  <text x="440" y="485" class="head green">Typed IR fast paths</text>
  <text x="440" y="511" class="body green">Native arithmetic; proven checks</text>
  <text x="82" y="538" class="small green">Limits: default int64 overflow; unboxed NaN identity. No blanket speed/parity guarantee.</text>
  <text x="62" y="588" class="head yellow">Y BOUND · Supported with cost / contract limits</text>
  <text x="62" y="617" class="body yellow">Strings + dictionaries · classes / properties / inheritance</text>
  <text x="62" y="643" class="body yellow">Generators + cleanup · exceptions + native unwinding</text>
  <text x="62" y="669" class="body yellow">Closed value unions · boxed items · retained memory</text>
  <text x="62" y="710" class="head yellow">Y PROTO · Three separate representations</text>
  <text x="62" y="738" class="body yellow">Dynamic Any: mixed records, runtime boxes and identity tracking</text>
  <text x="62" y="763" class="body yellow">Promoting ints: python-int opt-in; inline while values fit 64 bits</text>
  <text x="62" y="789" class="body yellow">Recursive JSON: closed recursive union boxes; no Any opt-in needed</text>
  <rect x="60" y="806" width="730" height="125" rx="12" fill="#fce9e7" stroke="#ba4036" stroke-width="2"/>

  <text x="855" y="656" class="body red">General finalizer semantics</text>
  <rect x="850" y="700" width="295" height="145" rx="10" fill="#f0f4fa" stroke="#b4c1d3"/>
  <text x="868" y="729" class="body" font-weight="700">Supported explicit interop</text>
  <text x="868" y="759" class="small">CPython bridge / extensions</text>
  <text x="868" y="785" class="small">have a separate contract from</text>
  <text x="868" y="811" class="small">native feature coverage.</text>
  <text x="40" y="1013" class="body">Preserve the native core. Keep useful extensions bounded. Fix local correctness gaps.</text>
  <text x="40" y="1040" class="small">Detailed contracts, cost dimensions and evidence: docs/support-surface.md</text>
</svg>

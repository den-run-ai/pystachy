<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Compatibility payoff versus implementation complexity and runtime cost</title>
<desc id="desc">An ordinal three-by-three map places nine representative Pystachy paths by implementation complexity and runtime CPU/memory overhead. Circle area shows estimated compatibility payoff, not API counts. Blue B outlines denote documented bounded contracts, not full CPython parity. Red GAP outlines identify known semantic gaps in the associated dynamic Any contract. M badges point to historical matched measurements, while S badges denote structural source/test evidence. All placements and payoff sizes are qualitative estimates. Compilation is excluded from the vertical axis.</desc>
<style>
text {font-family: "DejaVu Sans", Arial, sans-serif; fill:#18263b;}
.title {font-size:28px;font-weight:700;}
.head {font-size:20px;font-weight:700;}
.body {font-size:17px;}
.small {font-size:15px;fill:#45556d;}
.label {font-size:16px;font-weight:700;}
.id {font-size:25px;font-weight:700;}
.badge {font-size:13px;font-weight:700;}
.low {fill:#145232;}.medium {fill:#765600;}.high {fill:#912f29;}
</style>
<rect width="1200" height="1200" fill="#fff"/>

<text x="35" y="45" class="title" >Compatibility payoff versus implementation and runtime cost</text>
<text x="35" y="79" class="body" >Circle area = estimated payoff · outline = correctness boundary · badge = cost evidence</text>
<text x="35" y="109" class="small" >Ordinal bins and sizes; no measured scores, coverage percentages or between-bin ratios.</text>
<rect x="150" y="170" width="1005" height="690" rx="12" fill="#f7f9fc" stroke="#afbdcf" stroke-width="2"/>
